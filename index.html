<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Trip Cost" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <title>Trip Cost</title>
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f2f7;
      min-height: 100vh;
      padding: env(safe-area-inset-top, 20px) 16px 32px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #000;
      margin: 24px 0 20px;
    }

    .mode-toggle {
      display: flex;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .mode-toggle button {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      background: transparent;
      color: #888;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .mode-toggle button.active {
      background: #007aff;
      color: #fff;
      border-radius: 10px;
    }

    .section { margin-bottom: 14px; }

    input[type="text"], input[type="number"] {
      width: 100%;
      font-size: 16px;
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      background: #fff;
      color: #000;
      outline: none;
      -webkit-appearance: none;
      margin-bottom: 8px;
      display: block;
    }

    input[type="text"]::placeholder,
    input[type="number"]::placeholder { color: #bbb; }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .row input { margin-bottom: 0; flex: 1; }

    .toggle {
      display: flex;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .toggle button {
      padding: 10px 12px;
      font-size: 15px;
      font-weight: 500;
      border: none;
      background: transparent;
      color: #888;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .toggle button.active {
      background: #007aff;
      color: #fff;
      border-radius: 10px;
    }

    .toggle.vehicle {
      width: 100%;
      margin-bottom: 14px;
    }

    .toggle.vehicle button {
      flex: 1;
      padding: 10px 4px;
      font-size: 14px;
    }

    .toggle.vehicle button.active {
      background: #34c759;
      color: #fff;
      border-radius: 10px;
    }

    .toggle.vehicle .mpg {
      font-size: 12px;
      font-weight: 400;
      margin-top: 2px;
    }

    .lookup-btn {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      margin-bottom: 14px;
    }

    .lookup-btn:active { opacity: 0.8; }
    .lookup-btn:disabled { background: #aaa; }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px 8px;
      text-align: center;
    }

    .card.fastest { border: 2px solid #007aff; }
    .card.slowest { border: 2px solid #ff9500; }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: #e5f0ff;
      color: #007aff;
      margin-bottom: 8px;
    }

    .badge.slowest {
      background: #fff2e5;
      color: #ff9500;
    }

    .spacer { height: 23px; }

    .speed-label { font-size: 13px; color: #888; margin-bottom: 6px; }

    .time-val {
      font-size: 20px;
      font-weight: 600;
      color: #000;
      line-height: 1.2;
    }

    .time-sub { font-size: 12px; color: #aaa; margin-top: 4px; }

    .fuel-info {
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: #555;
      line-height: 1.8;
      margin-bottom: 10px;
    }

    .fuel-info .label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #aaa;
      margin-bottom: 6px;
    }

    .fuel-total {
      font-size: 28px;
      font-weight: 700;
      color: #34c759;
    }

    .fuel-breakdown { font-size: 13px; color: #888; margin-top: 2px; }

    .dist-summary {
      background: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      color: #555;
      margin-bottom: 14px;
      text-align: center;
    }

    .dist-summary strong { color: #000; }

    .price-note { font-size: 12px; color: #bbb; text-align: center; margin-top: 2px; }

    .error-msg {
      background: #fff0f0;
      color: #c0392b;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      margin-bottom: 14px;
      text-align: center;
    }

    .placeholder {
      text-align: center;
      color: #aaa;
      font-size: 15px;
      margin-top: 40px;
      line-height: 1.6;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>Trip Cost</h1>

  <div class="mode-toggle">
    <button class="active" id="btn-addr" onclick="setMode('address')">By address</button>
    <button id="btn-dist" onclick="setMode('distance')">By distance</button>
  </div>

  <!-- Address mode -->
  <div id="addr-section" class="section">
    <input type="text" id="origin" placeholder="Starting address" />
    <input type="text" id="destination" placeholder="Destination address" />
    <button class="lookup-btn" id="lookup-btn" onclick="lookupDistance()">Calculate route</button>
  </div>

  <!-- Distance mode -->
  <div id="dist-section" class="section hidden">
    <div class="row">
      <input type="number" id="distInput" placeholder="Enter distance..." min="0" oninput="calculate()" />
      <div class="toggle">
        <button class="active" id="btn-mi" onclick="setUnit('mi')">mi</button>
        <button id="btn-km" onclick="setUnit('km')">km</button>
      </div>
    </div>
  </div>

  <!-- Results (the vehicle toggle is rendered here, right above the fuel cost) -->
  <div id="results">
    <p class="placeholder">Enter addresses or a distance<br>to see your trip cost.</p>
  </div>

</body>
<script>
  const ORS_API_KEY = CONFIG.ORS_API_KEY;

  const PLACEHOLDER_HTML = '<p class="placeholder">Enter addresses or a distance<br>to see your trip cost.</p>';

  let mode = 'address';
  let unit = 'mi';
  let vehicle = 'car';
  let resolvedMiles = null;
  let resolvedLabel = null;

  const config = {
    car:    { name: 'Car',          mpg: 35,    fuelType: 'regular', fuelLabel: 'Regular gas, US avg' },
    suv:    { name: 'SUV',          mpg: 22,    fuelType: 'regular', fuelLabel: 'Regular gas, US avg' },
    truck:  { name: 'Truck',        mpg: 14.69, fuelType: 'diesel',  fuelLabel: 'Diesel, US avg' },
    camper: { name: 'Truck/Camper', mpg: 12.78, fuelType: 'diesel',  fuelLabel: 'Diesel, US avg' }
  };
  const vehicleOrder = ['car', 'suv', 'truck', 'camper'];

  // ---------------------------------------------------------------
  // Fuel prices
  // ---------------------------------------------------------------
  // One set of fallback prices, used whenever live EIA data is unavailable.
  const FALLBACK_PRICES = { regular: 3.72, diesel: 5.02 };
  const PRICE_CACHE_KEY = 'fuelPrices_v2';

  let priceData = null;
  let pricePromise = null;

  function getWeekKey() {
    const now = new Date();
    const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
    return weekStart.toDateString();
  }

  // Latest weekly US-average retail price for one EIA product code.
  // Returns { price, period } or null if the request or the value is unusable.
  async function fetchEiaLatest(product, apiKey) {
    const url = `https://api.eia.gov/v2/petroleum/pri/gnd/data/?api_key=${apiKey}&frequency=weekly&data[0]=value&facets[duoarea][]=NUS&facets[product][]=${product}&sort[0][column]=period&sort[0][direction]=desc&offset=0&length=1`;
    try {
      const res = await fetch(url);
      if (!res.ok) return null;
      const json = await res.json();
      const row = json.response && json.response.data && json.response.data[0];
      const price = row ? parseFloat(row.value) : NaN;
      if (!isFinite(price) || price <= 0) return null;
      return { price: price, period: row.period };
    } catch (err) {
      console.log('EIA request failed for ' + product + ':', err.message);
      return null;
    }
  }

  async function fetchCurrentPrices() {
    const weekKey = getWeekKey();

    // Use the cache only if it holds live EIA prices for both fuels this week.
    try {
      const cached = localStorage.getItem(PRICE_CACHE_KEY);
      if (cached) {
        const parsed = JSON.parse(cached);
        if (parsed.weekKey === weekKey && parsed.regularLive && parsed.dieselLive) {
          priceData = parsed;
          return priceData;
        }
      }
    } catch (err) {
      console.log('Could not read price cache:', err.message);
    }

    const EIA_API_KEY = CONFIG.EIA_API_KEY;
    let gas = null;
    let diesel = null;

    if (EIA_API_KEY && EIA_API_KEY !== 'PASTE_YOUR_EIA_API_KEY_HERE') {
      [gas, diesel] = await Promise.all([
        fetchEiaLatest('EPM0', EIA_API_KEY),     // Regular gasoline
        fetchEiaLatest('EPD2DXL0', EIA_API_KEY)  // No. 2 diesel
      ]);
    } else {
      console.log('EIA API key not configured, using fallback prices');
    }

    priceData = {
      regular: gas ? gas.price : FALLBACK_PRICES.regular,
      diesel: diesel ? diesel.price : FALLBACK_PRICES.diesel,
      regularPeriod: gas ? gas.period : null,
      dieselPeriod: diesel ? diesel.period : null,
      regularLive: !!gas,
      dieselLive: !!diesel,
      weekKey: weekKey,
      lastUpdated: new Date().toISOString()
    };

    // Only cache complete, live data so a failed lookup is retried on the next load.
    if (gas && diesel) {
      try {
        localStorage.setItem(PRICE_CACHE_KEY, JSON.stringify(priceData));
      } catch (err) {
        console.log('Could not write price cache:', err.message);
      }
    }

    return priceData;
  }

  // Share one in-flight/finished lookup across callers.
  function ensurePrices() {
    if (!pricePromise) pricePromise = fetchCurrentPrices();
    return pricePromise;
  }

  function getPriceForVehicle(vehicleType) {
    const fuelType = config[vehicleType].fuelType;
    if (!priceData) return FALLBACK_PRICES[fuelType];
    return priceData[fuelType];
  }

  function formatPeriod(period) {
    const parts = period.split('-').map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2])
      .toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Describes where the price came from, using the date of the EIA data actually used.
  function getPriceNote(vehicleType) {
    const cfg = config[vehicleType];
    const fuel = cfg.fuelType;
    if (priceData && priceData[fuel + 'Live'] && priceData[fuel + 'Period']) {
      return `${cfg.fuelLabel} &mdash; EIA, as of ${formatPeriod(priceData[fuel + 'Period'])}`;
    }
    return `${cfg.fuelLabel} &mdash; fallback estimate (live price unavailable)`;
  }

  // ---------------------------------------------------------------
  // Controls
  // ---------------------------------------------------------------
  function setMode(m) {
    mode = m;
    resolvedMiles = null;
    resolvedLabel = null;
    document.getElementById('btn-addr').classList.toggle('active', m === 'address');
    document.getElementById('btn-dist').classList.toggle('active', m === 'distance');
    document.getElementById('addr-section').classList.toggle('hidden', m !== 'address');
    document.getElementById('dist-section').classList.toggle('hidden', m !== 'distance');
    document.getElementById('results').innerHTML = PLACEHOLDER_HTML;
  }

  function setUnit(u) {
    unit = u;
    document.getElementById('btn-mi').classList.toggle('active', u === 'mi');
    document.getElementById('btn-km').classList.toggle('active', u === 'km');
    calculate();
  }

  function setVehicle(v) {
    vehicle = v;
    calculate(); // re-renders the results, including the vehicle toggle
  }

  function vehicleToggleHTML() {
    const buttons = vehicleOrder.map(v => {
      const c = config[v];
      const mpgText = +c.mpg.toFixed(1);
      return `
        <button class="${v === vehicle ? 'active' : ''}" onclick="setVehicle('${v}')">
          <div>${c.name}</div>
          <div class="mpg">${mpgText} mpg</div>
        </button>`;
    }).join('');
    return `<div class="toggle vehicle">${buttons}</div>`;
  }

  // ---------------------------------------------------------------
  // Route lookup
  // ---------------------------------------------------------------
  async function geocode(address) {
    const url = `https://api.openrouteservice.org/geocode/search?api_key=${ORS_API_KEY}&text=${encodeURIComponent(address)}&size=1`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.features || data.features.length === 0) throw new Error(`Could not find: "${address}"`);
    return data.features[0].geometry.coordinates; // [lng, lat]
  }

  async function lookupDistance() {
    const origin = document.getElementById('origin').value.trim();
    const destination = document.getElementById('destination').value.trim();
    const btn = document.getElementById('lookup-btn');
    const results = document.getElementById('results');

    if (!origin || !destination) {
      results.innerHTML = '<div class="error-msg">Please enter both a starting address and a destination.</div>';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Looking up route...';
    results.innerHTML = '<p class="placeholder">Fetching route...</p>';

    try {
      const [originCoords, destCoords] = await Promise.all([geocode(origin), geocode(destination)]);

      const routeRes = await fetch('https://api.openrouteservice.org/v2/directions/driving-car', {
        method: 'POST',
        headers: {
          'Authorization': ORS_API_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ coordinates: [originCoords, destCoords] })
      });

      const routeData = await routeRes.json();

      if (!routeData.routes || routeData.routes.length === 0) {
        throw new Error('No route found between those addresses.');
      }

      await ensurePrices();

      const meters = routeData.routes[0].summary.distance;
      resolvedMiles = meters / 1609.34;
      resolvedLabel = `${resolvedMiles.toFixed(1)} mi by road`;
      renderResults(resolvedMiles, resolvedLabel);

    } catch (err) {
      results.innerHTML = `<div class="error-msg">${err.message || 'Something went wrong. Please check your addresses and try again.'}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Calculate route';
    }
  }

  async function calculate() {
    await ensurePrices();

    if (mode === 'address') {
      if (resolvedMiles) renderResults(resolvedMiles, resolvedLabel);
      return;
    }
    const raw = parseFloat(document.getElementById('distInput').value);
    if (isNaN(raw) || raw <= 0) {
      document.getElementById('results').innerHTML = PLACEHOLDER_HTML;
      return;
    }
    const miles = unit === 'mi' ? raw : raw / 1.60934;
    renderResults(miles);
  }

  function formatTime(hours) {
    if (!isFinite(hours) || hours <= 0) return '—';
    const h = Math.floor(hours);
    const m = Math.round((hours - h) * 60);
    if (h === 0) return m + ' min';
    if (m === 0) return h + ' hr';
    return h + ' hr ' + m + ' min';
  }

  function renderResults(distMi, distLabel) {
    const vehicleConfig = config[vehicle];
    const pricePerGallon = getPriceForVehicle(vehicle);
    const gallonsUsed = distMi / vehicleConfig.mpg;
    const totalCost = gallonsUsed * pricePerGallon;
    const speeds = [75, 70, 65, 60];

    const summary = distLabel
      ? `<div class="dist-summary">Route distance: <strong>${distLabel}</strong></div>`
      : '';

    const cards = speeds.map((speed, i) => {
      const hours = distMi / speed;
      const isFastest = i === 0;
      const isSlowest = i === speeds.length - 1;
      let badge = '';
      let cardClass = 'card';

      if (isFastest) {
        badge = '<div class="badge">fastest</div>';
        cardClass += ' fastest';
      } else if (isSlowest) {
        badge = '<div class="badge slowest">slowest</div>';
        cardClass += ' slowest';
      } else {
        badge = '<div class="spacer"></div>';
      }

      return `
        <div class="${cardClass}">
          ${badge}
          <div class="speed-label">${speed} mph</div>
          <div class="time-val">${formatTime(hours)}</div>
          <div class="time-sub">${hours.toFixed(2)} hrs</div>
        </div>`;
    }).join('');

    const fuelSection = `
      <div class="fuel-info">
        <div class="label">Estimated fuel cost</div>
        <div class="fuel-total">$${totalCost.toFixed(2)}</div>
        <div class="fuel-breakdown">${distMi.toFixed(1)} mi &divide; ${vehicleConfig.mpg} mpg = ${gallonsUsed.toFixed(2)} gal &times; $${pricePerGallon.toFixed(2)}</div>
      </div>
      <p class="price-note">${getPriceNote(vehicle)}</p>`;

    document.getElementById('results').innerHTML =
      summary +
      `<div class="cards">${cards}</div>` +
      vehicleToggleHTML() +
      fuelSection;
  }

  // Initialize prices when the page loads
  ensurePrices();
</script>
</html>
